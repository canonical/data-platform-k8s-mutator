name: data-platform-k8s-mutator
base: ubuntu@24.04
version: "1.0"
summary: Product-agnostic mutating webhook for pod sysctls
description: |
  Mutating admission webhook that injects
  sysctls (e.g. net.ipv4.tcp_retries2) into
  Kubernetes workloads at admission time.
platforms:
  amd64:
extensions:
  - fastapi-framework
