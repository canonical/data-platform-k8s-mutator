# Minimal Deployment used by cluster e2e to verify the webhook mutates in-scope workloads.
# Must match bootstrap scope: namespace default, label app.kubernetes.io/managed-by=juju, container name "app".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-test-app
  namespace: default
  labels:
    app.kubernetes.io/managed-by: juju
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-test-app
  template:
    metadata:
      labels:
        app: e2e-test-app
        app.kubernetes.io/managed-by: juju
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
