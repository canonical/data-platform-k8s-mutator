[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "integration*"]

[tool.setuptools.package-data]
"scripts" = ["templates/*.j2"]

[tool.setuptools]
py-modules = ["app"]

[project]
name = "data-platform-k8s-mutator"
version = "1.0.0"
description = "Kubernetes mutating admission webhook that injects a sysctl into workload pod specs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "fastapi[standard]",
    "uvicorn",
    "jinja2>=3.0",
    "tenacity>=8.0",
]

[tool.ruff]
# Match tox lint/fmt (app.py + scripts/)
target-version = "py310"

[tool.ruff.lint]
extend-ignore = ["D", "E501"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pre-commit",
]
